services:
  db:
    image: mysql:8.0
    platform: linux/amd64
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-alberto_inventory_db}
      MYSQL_USER: ${DB_USER:-user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      # Changed the default external port fallback from 3307 to 3308
      - "${DB_PORT_EXTERNAL:-3308}:3306" 
    healthcheck:
      # Without this, `web`/`tests` start migrate before MySQL is accepting
      # connections and fail intermittently with "Can't connect to MySQL server".
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build: .
    command: >
      sh -c "python alberto_system/manage.py migrate &&
             python alberto_system/manage.py collectstatic --no-input &&
             python alberto_system/manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "${WEB_PORT:-8000}:8000"
    environment:
      - DEBUG=True
      # core/settings.py configures the DB with dj_database_url, which reads
      # DATABASE_URL only. The previous DB_NAME/DB_USER/DB_PASSWORD/DB_HOST/DB_PORT
      # vars were never read, so MySQL was started but ignored and the app
      # silently fell back to SQLite inside the container.
      - DATABASE_URL=mysql://${DB_USER:-user}:${DB_PASSWORD:-password}@db:3306/${DB_NAME:-alberto_inventory_db}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Uses python (already in the image) so no extra package is needed.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/accounts/login/')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  selenium:
    image: selenium/standalone-chrome:latest
    platform: linux/amd64
    shm_size: 2gb
    ports:
      - "4444:4444"
      - "7900:7900"

  tests:
    build: .
    volumes:
      - .:/app
    environment:
      - DEBUG=True
      - DATABASE_URL=mysql://${DB_USER:-user}:${DB_PASSWORD:-password}@db:3306/${DB_NAME:-alberto_inventory_db}
      - SELENIUM_URL=http://selenium:4444/wd/hub
      - WEB_URL=http://web:8000
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy
      selenium:
        condition: service_started
    command: >
      sh -c "pytest alberto_system/inventory/tests_integration.py"

volumes:
  mysql_data: