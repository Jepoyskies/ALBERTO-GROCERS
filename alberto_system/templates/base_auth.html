{% load static %}
<!doctype html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Login portal for Alberto Grocers - Inventory and POS System">
    <title>{% block title %}Alberto Inventory POS{% endblock %}</title>
    <link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}">

    <!-- Google Fonts: Inter + Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        :root {
            --ag-red: #E53935;
            --ag-red-dark: #C62828;
            --ag-green: #2E7D32;
            --ag-green-dark: #1B5E20;
            --ag-green-light: #43A047;
            --ag-yellow: #FDD835;
            --ag-yellow-dark: #F9A825;
            --ag-cream: #FFF8E1;
            --ag-dark: #1a1a2e;
            --ag-white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        /* ===== SPLIT SCREEN LAYOUT ===== */
        .auth-split {
            display: flex;
            min-height: 100vh;
        }

        /* ===== LEFT BRANDING PANEL ===== */
        .auth-branding {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 3rem;
            position: relative;
            overflow: hidden;
            background: linear-gradient(160deg, var(--ag-green-dark) 0%, var(--ag-green) 40%, var(--ag-green-light) 100%);
        }

        /* Decorative background circles */
        .auth-branding::before {
            content: '';
            position: absolute;
            top: -150px;
            right: -150px;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: rgba(253, 216, 53, 0.12);
        }

        .auth-branding::after {
            content: '';
            position: absolute;
            bottom: -100px;
            left: -100px;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: rgba(229, 57, 53, 0.10);
        }

        .branding-content {
            position: relative;
            z-index: 1;
        }

        .branding-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 3rem;
        }

        .branding-logo img {
            height: 50px;
            width: auto;
            filter: brightness(0) invert(1);
        }

        .branding-logo span {
            font-family: 'Poppins', sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--ag-white);
            letter-spacing: 0.5px;
        }

        .branding-hero {
            max-width: 420px;
        }

        .branding-hero h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--ag-white);
            line-height: 1.2;
            margin-bottom: 1rem;
        }

        .branding-hero h1 .highlight {
            color: var(--ag-yellow);
        }

        .branding-hero p {
            font-size: 1.05rem;
            color: rgba(255, 255, 255, 0.85);
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .branding-features {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 12px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.95rem;
        }

        .feature-item i {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.15);
            color: var(--ag-yellow);
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .branding-footer {
            position: relative;
            z-index: 1;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.85rem;
        }

        /* ===== RIGHT FORM PANEL ===== */
        .auth-form-panel {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: var(--ag-white);
        }

        .auth-form-container {
            width: 100%;
            max-width: 400px;
        }

        .form-header {
            margin-bottom: 2rem;
        }

        .form-header h2 {
            font-family: 'Poppins', sans-serif;
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--ag-dark);
            margin-bottom: 0.5rem;
        }

        .form-header p {
            color: #666;
            font-size: 0.95rem;
        }

        /* ===== FORM STYLES ===== */
        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--ag-dark);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-size: 0.95rem;
            z-index: 2;
        }

        .input-wrapper .form-control {
            padding: 12px 14px 12px 44px;
            border: 2px solid #e8e8e8;
            border-radius: 10px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            background: #fafafa;
        }

        .input-wrapper .form-control:focus {
            border-color: var(--ag-green);
            background: var(--ag-white);
            box-shadow: 0 0 0 4px rgba(46, 125, 50, 0.1);
            outline: none;
        }

        .input-wrapper .form-control::placeholder {
            color: #aaa;
        }

        /* Password toggle */
        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            font-size: 0.95rem;
            padding: 4px;
            z-index: 2;
            transition: color 0.2s;
        }

        .password-toggle:hover {
            color: var(--ag-green);
        }

        /* Remember me & Forgot password */
        .form-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }

        .form-check {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-check-input {
            width: 18px;
            height: 18px;
            border: 2px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            accent-color: var(--ag-green);
        }

        .form-check-label {
            font-size: 0.85rem;
            color: #555;
            cursor: pointer;
        }

        .forgot-link {
            font-size: 0.85rem;
            color: var(--ag-green);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .forgot-link:hover {
            color: var(--ag-green-dark);
            text-decoration: underline;
        }

        /* ===== SUBMIT BUTTON ===== */
        .btn-signin {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--ag-green) 0%, var(--ag-green-dark) 100%);
            color: var(--ag-white);
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }

        .btn-signin::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn-signin:hover::before {
            left: 100%;
        }

        .btn-signin:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(46, 125, 50, 0.35);
        }

        .btn-signin:active {
            transform: translateY(0);
        }

        /* ===== ALERT STYLES ===== */
        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.9rem;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .alert-danger {
            background: #FFEBEE;
            color: var(--ag-red-dark);
            border: 1px solid #FFCDD2;
        }

        .alert i {
            font-size: 1rem;
        }

        /* ===== COPYRIGHT ===== */
        .auth-copyright {
            text-align: center;
            margin-top: 2rem;
            color: #999;
            font-size: 0.8rem;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .auth-split {
                flex-direction: column;
            }

            .auth-branding {
                padding: 2rem;
                min-height: 280px;
            }

            .branding-hero h1 {
                font-size: 1.75rem;
            }

            .branding-hero p {
                font-size: 0.9rem;
            }

            .branding-features {
                display: none;
            }

            .auth-form-panel {
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>
<body>
    {% block content %}
    {% endblock %}

    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
