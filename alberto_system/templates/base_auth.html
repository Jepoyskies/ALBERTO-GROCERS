{% load static %}
<!doctype html>
<html lang="en" dir="ltr" data-bs-theme="light">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Login portal for Alberto Grocers - Inventory and POS System">
    <title>{% block title %}Alberto POS{% endblock %}</title>
    <link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}">

    <!-- Apply saved theme before first paint -->
    <script>
        (function () {
            try {
                var stored = localStorage.getItem('albertoTheme');
                if (stored !== 'light' && stored !== 'dark') {
                    stored = 'light';
                }
                document.documentElement.setAttribute('data-bs-theme', stored);
            } catch (e) {
                document.documentElement.setAttribute('data-bs-theme', 'light');
            }
        })();
    </script>

    <!-- Google Fonts: Poppins (the one brand typeface) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap CSS -->
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- ALBERTO GROCERS THEME: tokens, then the shared component library.
         Single source of truth for every colour - the rules below are layout
         only and hold no colour of their own. -->
    <link rel="stylesheet" href="{% static 'css/ag-tokens.css' %}">
    <link rel="stylesheet" href="{% static 'css/ag-components.css' %}">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        /* ===== FULL-PAGE BACKGROUND ===== */
        .auth-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            position: relative;
            overflow: hidden;
        }

        /* Light mode: rich fresh-green gradient */
        .auth-page {
            background: linear-gradient(160deg, #1B5E20 0%, #2E7D32 35%, #43A047 70%, #66BB6A 100%);
        }

        /* Dark mode: deep green-black */
        [data-bs-theme="dark"] .auth-page {
            background: linear-gradient(160deg, #0C2A11 0%, #0F1512 40%, #14261A 70%, #17211B 100%);
        }

        /* ===== DECORATIVE CIRCLES ===== */
        .auth-page::before {
            content: '';
            position: absolute;
            top: -200px;
            right: -200px;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: rgba(253, 216, 53, 0.08);
            pointer-events: none;
        }

        .auth-page::after {
            content: '';
            position: absolute;
            bottom: -150px;
            left: -150px;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: rgba(253, 216, 53, 0.06);
            pointer-events: none;
        }

        /* Subtle yellow glow in center */
        .auth-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(253, 216, 53, 0.06) 0%, transparent 70%);
            pointer-events: none;
        }

        /* ===== TRICOLOUR BAR AT TOP ===== */
        .auth-tricolor-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--brand-tricolor);
            z-index: 1050;
        }

        /* ===== CENTERED CONTENT COLUMN ===== */
        .auth-content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 440px;
        }

        /* ===== BRANDING SECTION ===== */
        .auth-branding {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .auth-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            margin-bottom: 1rem;
            border-radius: 999px;
            background: var(--brand-red);
            color: #FFFFFF;
            font-size: 0.68rem;
            font-weight: 800;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            box-shadow: 0 3px 12px rgba(217, 43, 32, 0.35);
        }

        .auth-logo {
            margin-bottom: 1.25rem;
        }

        .auth-logo img {
            height: 64px;
            width: 64px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            object-fit: cover;
        }

        .auth-welcome {
            font-family: 'Poppins', sans-serif;
            font-size: 1.75rem;
            font-weight: 700;
            color: #FFFFFF;
            line-height: 1.3;
            margin-bottom: 0.5rem;
        }

        .auth-welcome .highlight {
            color: var(--brand-yellow);
        }

        .auth-subtitle {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.85);
            line-height: 1.5;
            margin-bottom: 0;
        }

        /* ===== LOGIN CARD ===== */
        .auth-card {
            width: 100%;
            background: #FFFFFF;
            border-radius: 20px;
            padding: 2rem 1.75rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
            margin-bottom: 1.5rem;
        }

        [data-bs-theme="dark"] .auth-card {
            background: #1F2B23;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .auth-card-header {
            margin-bottom: 1.5rem;
        }

        .auth-card-header h2 {
            font-family: 'Poppins', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--ag-text);
            margin-bottom: 0.25rem;
        }

        .auth-card-header p {
            color: var(--ag-text-muted);
            font-size: 0.875rem;
            margin-bottom: 0;
        }

        /* ===== FORM STYLES ===== */
        .form-group {
            margin-bottom: 1.1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--ag-text);
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--ag-text-faint);
            font-size: 0.9rem;
            z-index: 2;
        }

        .input-wrapper .form-control {
            padding: 11px 14px 11px 42px;
            border: 2px solid var(--ag-border-control);
            border-radius: 12px;
            font-size: 0.9rem;
            transition: all 0.25s ease;
            background: #F9FBF9;
            color: var(--ag-text);
        }

        [data-bs-theme="dark"] .input-wrapper .form-control {
            background: #17211B;
            color: #EDF3EE;
        }

        .input-wrapper .form-control:focus {
            border-color: var(--brand-green);
            background: #FFFFFF;
            box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.2);
            outline: none;
        }

        [data-bs-theme="dark"] .input-wrapper .form-control:focus {
            background: #1F2B23;
        }

        .input-wrapper .form-control::placeholder {
            color: var(--ag-text-faint);
        }

        /* Fix autofill styles */
        .input-wrapper .form-control:-webkit-autofill,
        .input-wrapper .form-control:-webkit-autofill:hover,
        .input-wrapper .form-control:-webkit-autofill:focus {
            -webkit-text-fill-color: var(--ag-text);
            -webkit-box-shadow: 0 0 0 1000px #F9FBF9 inset;
            transition: background-color 5000s ease-in-out 0s;
        }

        [data-bs-theme="dark"] .input-wrapper .form-control:-webkit-autofill,
        [data-bs-theme="dark"] .input-wrapper .form-control:-webkit-autofill:hover,
        [data-bs-theme="dark"] .input-wrapper .form-control:-webkit-autofill:focus {
            -webkit-text-fill-color: #EDF3EE;
            -webkit-box-shadow: 0 0 0 1000px #17211B inset;
        }

        /* Password toggle */
        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--ag-text-faint);
            cursor: pointer;
            font-size: 0.9rem;
            padding: 4px;
            z-index: 2;
            transition: color 0.2s;
        }

        .password-toggle:hover {
            color: var(--brand-green);
        }

        /* Remember me & Forgot password */
        .form-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.25rem;
        }

        .form-check {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-check-input {
            width: 16px;
            height: 16px;
            border: 2px solid var(--ag-border-control);
            border-radius: 4px;
            cursor: pointer;
            accent-color: var(--brand-green);
        }

        .form-check-label {
            font-size: 0.8rem;
            color: var(--ag-text-muted);
            cursor: pointer;
        }

        .forgot-link {
            font-size: 0.8rem;
            color: var(--brand-green);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .forgot-link:hover {
            color: var(--brand-green-dark);
            text-decoration: underline;
        }

        /* ===== SUBMIT BUTTON ===== */
        .btn-signin {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 12px;
            background: var(--brand-green-gradient-cta);
            color: #FFFFFF;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }

        .btn-signin:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(46, 125, 50, 0.4);
        }

        .btn-signin:active {
            transform: translateY(0);
        }

        .btn-signin:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .btn-signin .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #FFFFFF;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .btn-signin.loading .spinner {
            display: inline-block;
        }

        .btn-signin.loading .btn-text {
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== ALERT STYLES ===== */
        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 1.1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .alert-danger {
            background: #FEF3F2;
            color: #B42318;
            border: 1px solid #FECDCA;
        }

        [data-bs-theme="dark"] .alert-danger {
            background: #2A1310;
            color: #FF9A92;
            border-color: #4A201A;
        }

        /* ===== FEATURE HIGHLIGHTS ===== */
        .auth-features {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 1rem;
        }

        .auth-feature-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.78rem;
            font-weight: 500;
            backdrop-filter: blur(4px);
        }

        [data-bs-theme="dark"] .auth-feature-pill {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .auth-feature-pill i {
            color: var(--brand-yellow);
            font-size: 0.85rem;
        }

        /* ===== COPYRIGHT ===== */
        .auth-copyright {
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.75rem;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .auth-page {
                padding: 1.5rem 1rem;
            }

            .auth-card {
                padding: 1.5rem 1.25rem;
            }

            .auth-welcome {
                font-size: 1.5rem;
            }

            .auth-features {
                flex-direction: column;
                align-items: center;
            }
        }

        @media (max-height: 768px) {
            .auth-page {
                padding: 1rem;
                justify-content: flex-start;
                padding-top: 2rem;
            }

            .auth-branding {
                margin-bottom: 1rem;
            }

            .auth-logo img {
                height: 48px;
                width: 48px;
            }

            .auth-welcome {
                font-size: 1.4rem;
            }

            .auth-card {
                padding: 1.5rem 1.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Tricolour bar at top -->
    <div class="auth-tricolor-bar"></div>

    {% block content %}
    {% endblock %}

    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>

    <script>
        // Theme toggle support
        (function() {
            const root = document.documentElement;
            const stored = localStorage.getItem('albertoTheme');
            if (stored === 'dark' || stored === 'light') {
                root.setAttribute('data-bs-theme', stored);
            }
        })();
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
